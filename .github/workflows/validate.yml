name: Validate translation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: >
          python -m py_compile
          tools/build_plugin.py
          tools/fetch_deps.py
          tools/package_release.py
          tools/validate_translation.py

      - name: Validate translation data
        run: python tools/validate_translation.py
